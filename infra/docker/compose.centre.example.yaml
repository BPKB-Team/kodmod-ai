# Merge with root docker-compose.yml. Copy to Docker Centre if recreating it.
# .env contains KODMOD_DOCKER_ROOT=F:/Docker_Centre/kodmod and the source path.
x-private-data: &private-data
  - type: bind
    source: "${KODMOD_DOCKER_ROOT}/data/audio"
    target: /var/lib/kodmod/audio
  - type: bind
    source: "${KODMOD_DOCKER_ROOT}/data/uploads"
    target: /var/lib/kodmod/uploads
services:
  postgres:
    container_name: null
    volumes:
      - type: bind
        source: "${KODMOD_DOCKER_ROOT}/data/postgres"
        target: /var/lib/postgresql/data
  redis:
    container_name: null
    volumes:
      - type: bind
        source: "${KODMOD_DOCKER_ROOT}/data/redis"
        target: /data
  qdrant:
    container_name: null
    # Keep the Linux named volume from docker-compose.yml. A Windows host bind
    # can appear as 9p inside Docker Desktop and Qdrant cannot guarantee WAL safety there.
  ai-engine:
    container_name: null
    volumes: *private-data
  migrate:
    volumes: *private-data
  worker:
    volumes: *private-data
