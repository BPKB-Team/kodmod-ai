# Full local runtime. Docker Centre on Windows uses scripts/docker.ps1.
# Local services use built images; edit source, then rebuild with `up`.
name: kodmod

x-api: &api
  image: kodmod/ai-engine:${KODMOD_TAG:-local}
  build:
    context: ./apps/ai-engine
    args:
      INSTALL_RERANKER: ${INSTALL_RERANKER:-false}
  env_file: ./apps/ai-engine/.env
  environment: &api-environment
    API_HOST: 0.0.0.0
    API_PORT: 8000
    DB_HOST: postgres
    DB_PORT: 5432
    DB_USER: kodmod
    DB_PASSWORD: kodmod
    DB_NAME: kodmod
    REDIS_HOST: redis
    REDIS_PORT: 6379
    QDRANT_URL: http://qdrant:6333
    VECTOR_BACKEND: ${VECTOR_BACKEND:-pgvector}
    QDRANT_COLLECTION: ${QDRANT_COLLECTION:-kodmod_curriculum_v2}
    QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-5}
    AUDIO_DIR: /var/lib/kodmod/audio
    UPLOAD_DIR: /var/lib/kodmod/uploads
    RAG_RERANK_ENABLED: ${RAG_RERANK_ENABLED:-false}
  volumes:
    - kodmod-audio:/var/lib/kodmod/audio
    - kodmod-uploads:/var/lib/kodmod/uploads

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kodmod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kodmod
      POSTGRES_PASSWORD: kodmod
      POSTGRES_DB: kodmod
    ports: ["127.0.0.1:${POSTGRES_PORT:-5433}:5432"]
    volumes: ["kodmod-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kodmod -d kodmod"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kodmod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: ["kodmod-redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *api
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }

  ai-engine:
    <<: *api
    container_name: kodmod-ai-engine
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports: ["127.0.0.1:${API_PORT:-8109}:8000"]

  worker:
    <<: *api
    command: ["python", "-m", "api.material_worker"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; p=Path('/tmp/kodmod-worker-heartbeat'); assert p.exists() and time.time()-p.stat().st_mtime<90"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    image: kodmod/web:${KODMOD_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_ORIGIN: http://ai-engine:8000
    restart: unless-stopped
    init: true
    environment:
      API_ORIGIN: http://ai-engine:8000
      NODE_ENV: production
      # Explicit server-only override for local HTTP; VPS sets this to true.
      SESSION_COOKIE_SECURE: "false"
    depends_on:
      ai-engine: { condition: service_healthy }
    ports: ["127.0.0.1:${WEB_PORT:-3100}:3000"]

  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: kodmod-qdrant
    restart: unless-stopped
    profiles: ["qdrant"]
    volumes: ["kodmod-qdrantdata:/qdrant/storage"]

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
    volumes:
      - type: bind
        source: ./infra/docker/prometheus.local.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: ./infra/docker/prometheus-alerts.yml
        target: /etc/prometheus/rules.yml
        read_only: true
      - type: bind
        source: ${MONITORING_DATA_ROOT:-./.runtime/monitoring}/prometheus
        target: /prometheus
        bind: { create_host_path: true }
    depends_on:
      cadvisor: { condition: service_started }
    mem_limit: 512m
    cpus: 0.50
    logging:
      options: { max-size: 10m, max-file: "3" }

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-only-change-this}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3001}/
      GF_SECURITY_COOKIE_SECURE: "false"
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    volumes:
      - type: bind
        source: ${MONITORING_DATA_ROOT:-./.runtime/monitoring}/grafana
        target: /var/lib/grafana
        bind: { create_host_path: true }
      - type: bind
        source: ./infra/docker/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
      - type: bind
        source: ./infra/docker/grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
    depends_on:
      prometheus: { condition: service_started }
    mem_limit: 512m
    cpus: 0.25
    logging:
      options: { max-size: 10m, max-file: "3" }

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    profiles: ["monitoring"]
    restart: unless-stopped
    privileged: true
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - type: bind
        source: /
        target: /rootfs
        read_only: true
      - type: bind
        source: /var/run
        target: /var/run
        read_only: true
      - type: bind
        source: /sys
        target: /sys
        read_only: true
      - type: bind
        source: /var/lib/docker
        target: /var/lib/docker
        read_only: true
      - type: bind
        source: /dev/disk
        target: /dev/disk
        read_only: true
    mem_limit: 512m
    cpus: 0.25
    logging:
      options: { max-size: 10m, max-file: "3" }

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    profiles: ["monitoring-linux"]
    restart: unless-stopped
    pid: host
    read_only: true
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($|/)
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
      - type: bind
        source: /
        target: /host
        read_only: true
    mem_limit: 128m
    cpus: 0.10
    logging:
      options: { max-size: 10m, max-file: "3" }

volumes:
  kodmod-pgdata:
  kodmod-redisdata:
  kodmod-qdrantdata:
  kodmod-audio:
  kodmod-uploads:
